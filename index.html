<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Cœur</title>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
  font-family: Georgia, serif;
  background: linear-gradient(135deg,#ffe6f0,#fff0b3);
  display:flex;
  justify-content:center;
  align-items:center;
}

#container{
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* coeur blanc */
#coeur{
  width:100px;
  height:100px;
  background:white;
  transform:rotate(-45deg);
  position:relative;
  cursor:pointer;
  animation:pulse 1.4s infinite;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

#coeur::before,
#coeur::after{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  background:white;
  border-radius:50%;
}

#coeur::before{
  top:-50px;
  left:0;
}

#coeur::after{
  left:50px;
  top:0;
}

/* animation coeur */
@keyframes pulse{
  0%{transform:rotate(-45deg) scale(1);}
  50%{transform:rotate(-45deg) scale(1.08);}
  100%{transform:rotate(-45deg) scale(1);}
}

/* texte sous le coeur */
#titre{
  margin-top:25px;
  font-size:28px;
  color:#b30059;
  letter-spacing:2px;
}

/* vidéo */
video{
  display:none;
  width:90%;
  max-width:360px;
  max-height:40vh;
  border-radius:15px;
  margin-top:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div id="container">

<div id="coeur"></div>

<div id="titre">Le cœur piraté </div>

<video id="video" controls playsinline>
<source src="video.mp4" type="video/mp4">
Ton navigateur ne supporte pas la vidéo.
</video>

</div>

<script>

const coeur = document.getElementById("coeur")
const video = document.getElementById("video")
const titre = document.getElementById("titre")

coeur.addEventListener("click", () => {

coeur.style.display="none"
titre.style.display="none"
video.style.display="block"

})

</script>

</body>
</html>
